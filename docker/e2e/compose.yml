# Playwright e2e containers. Run from the repo root via npm scripts:
#   npm run test:e2e:docker:web | test:e2e:docker:electron | test:e2e:docker
# Source is copied into the image (no repo bind mount); only artifacts and snapshots are mounted.

x-e2e-common: &e2e-common
  ipc: host # Chromium needs more shared memory than Docker's 64 MB default
  init: true

x-e2e-build-args: &e2e-build-args
  PLAYWRIGHT_VERSION: '1.64.1'
  NODE_VERSION: '24'

services:
  e2e-web:
    <<: *e2e-common
    image: mathdefender-e2e-web
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: web
      args: *e2e-build-args
    volumes:
      - ../../test-results/docker-web:/app/e2e-artifacts

  e2e-electron:
    <<: *e2e-common
    image: mathdefender-e2e-electron
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: electron
      args: *e2e-build-args
    volumes:
      - ../../test-results/docker-electron:/app/e2e-artifacts
      # Read baselines and write `-linux.png` snapshots back to the repo on --update-snapshots.
      - ../../e2e/visual:/app/e2e/visual

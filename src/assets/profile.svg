<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Olive / Army Green Outer Frame Gradients -->
    <linearGradient id="armyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7543" />
      <stop offset="40%" stop-color="#4e562d" />
      <stop offset="80%" stop-color="#343a1d" />
      <stop offset="100%" stop-color="#212511" />
    </linearGradient>

    <linearGradient id="armyGreenInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#434b26" />
      <stop offset="100%" stop-color="#232713" />
    </linearGradient>

    <!-- Outer Frame Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Main Outer Frame Ring -->
    <circle cx="250" cy="242" r="215" fill="url(#armyGreen)" stroke="#181c0a" stroke-width="4" />
    <circle cx="250" cy="242" r="211" fill="none" stroke="#8d9c5b" stroke-width="2" opacity="0.7" />

    <!-- Solid Dark Green Inner Band (Replaces Zebra Pattern) -->
    <circle cx="250" cy="242" r="193" fill="none" stroke="#31371c" stroke-width="24" />
    <circle cx="250" cy="242" r="205" fill="none" stroke="#1d2110" stroke-width="2" />
    <circle cx="250" cy="242" r="181" fill="none" stroke="#191c0e" stroke-width="2" />

    <!-- Inner Metallic Accent Boundary -->
    <circle cx="250" cy="242" r="177" fill="none" stroke="url(#armyGreenInner)" stroke-width="6" />

    <!-- Transparent Center Cutout Area -->
    <circle cx="250" cy="242" r="174" fill="#8d9c5b" />

    <!-- Inner Edge Shadow for Depth -->
    <circle cx="250" cy="242" r="174" fill="none" stroke="#121509" stroke-width="4" opacity="0.35" />
  </g>
</svg>
